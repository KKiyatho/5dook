<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>풍류 대국: 오둑(O-Duk)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

        :root {
            --bg-color: #f4e9d5; /* 한지 느낌 */
            --board-color: #d2b48c; /* 나무판 */
            --ink-black: #1a1a1a;
            --paper-white: #fdfdfd;
            --stone-dead: #7a7a7a; /* 뒤집힌 돌 */
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Noto Serif KR', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--ink-black);
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }

        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }

        /* 메뉴 화면 */
        #menu { text-align: center; border: 4px double var(--ink-black); padding: 40px; background: rgba(255,255,255,0.3); }
        .btn {
            background: var(--ink-black);
            color: var(--bg-color);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Noto Serif KR', serif;
        }
        .btn:hover { background: #444; }

        /* 대국 화면 */
        #game-screen { display: none; text-align: center; }
        #board {
            display: grid;
            grid-template-columns: repeat(15, 40px);
            grid-template-rows: repeat(15, 40px);
            background-color: var(--board-color);
            border: 2px solid #5d4037;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            margin: 20px auto;
            position: relative;
        }

        .cell {
            width: 40px;
            height: 40px;
            border: 0.5px solid rgba(0,0,0,0.2);
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 돌 스타일 */
        .stone {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            z-index: 2;
            transition: all 0.3s;
        }
        .black { background: radial-gradient(circle at 30% 30%, #444, #000); }
        .white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 1px solid #aaa; }
        .dead { background: radial-gradient(circle at 30% 30%, #999, #555); transform: scale(0.85); cursor: not-allowed; }

        /* 규칙 모달 */
        #modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            border: 5px double var(--ink-black);
            padding: 30px;
            z-index: 10;
            max-width: 500px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #status { font-size: 1.5rem; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>오 둑 (五 局)</h1>
        <p><i>- 오목의 수와 바둑의 법이 만났도다 -</i></p>
        <button class="btn" onclick="startGame()">대국 시작</button><br>
        <button class="btn" onclick="toggleRules(true)">규칙 설명</button>
    </div>

    <div id="game-screen">
        <div id="status">흑 선비님의 차례입니다.</div>
        <div id="board"></div>
        <button class="btn" onclick="location.reload()">대국 포기</button>
    </div>

    <div id="modal">
        <h2>오둑의 규칙</h2>
        <ul style="text-align: left; line-height: 1.8;">
            <li><b>기본:</b> 오목판에서 진행하며 5줄을 먼저 만들면 승리합니다.</li>
            <li><b>포위:</b> 바둑처럼 상대의 돌을 완전히 둘러싸면 상대 돌을 뒤집습니다.</li>
            <li><b>돌무덤:</b> 뒤집힌 돌은 회색이 되며, 누구의 소유도 아닙니다. 그 자리에는 다시 돌을 둘 수 없습니다.</li>
            <li><b>제한:</b> 흑은 3-3과 장목(6목 이상)이 금지됩니다.</li>
            <li><b>무승부:</b> 판이 가득 차거나 더 이상 둘 곳이 없으면 무승부입니다.</li>
        </ul>
        <button class="btn" onclick="toggleRules(false)">알겠소</button>
    </div>

    <script>
        const size = 15;
        let board = Array.from({ length: size }, () => Array(size).fill(0));
        let currentPlayer = 1; // 1: Black, 2: White
        let gameOver = false;

        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');

        function toggleRules(show) {
            document.getElementById('modal').style.display = show ? 'block' : 'none';
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            createBoard();
        }

        function createBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.onclick = () => placeStone(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function placeStone(r, c) {
            if (board[r][c] !== 0 || gameOver) return;

            // 흑 3-3 등 제약 조건은 단순화를 위해 생략하거나 추가 로직 필요
            // 여기서는 기본 착수와 포위 로직에 집중합니다.

            board[r][c] = currentPlayer;
            updateBoard();

            // 포위 확인 (바둑 로직)
            checkCapture(r, c);
            
            // 승리 확인 (오목 로직)
            if (checkWin(r, c)) {
                statusEl.innerText = (currentPlayer === 1 ? "흑" : "백") + " 선비님이 승리하셨소! 대단한 수구려.";
                gameOver = true;
                return;
            }

            // 차례 변경
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            statusEl.innerText = (currentPlayer === 1 ? "흑" : "백") + " 선비님의 차례입니다.";
            
            if (isBoardFull()) {
                statusEl.innerText = "승부를 가리지 못했구려. 무승부요.";
                gameOver = true;
            }
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, idx) => {
                const r = Math.floor(idx / size);
                const c = idx % size;
                cell.innerHTML = '';
                if (board[r][c] !== 0) {
                    const stone = document.createElement('div');
                    stone.className = 'stone ' + (board[r][c] === 1 ? 'black' : board[r][c] === 2 ? 'white' : 'dead');
                    cell.appendChild(stone);
                }
            });
        }

        // 바둑 포위 로직
        function checkCapture(r, c) {
            const opponent = currentPlayer === 1 ? 2 : 1;
            const directions = [[0,1],[0,-1],[1,0],[-1,0]];
            
            directions.forEach(([dr, dc]) => {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < size && nc >= 0 && nc < size && board[nr][nc] === opponent) {
                    const group = [];
                    if (!hasLiberty(nr, nc, opponent, new Set(), group)) {
                        group.forEach(([gr, gc]) => {
                            board[gr][gc] = -1; // 돌무덤(뒤집힘)
                        });
                    }
                }
            });
            updateBoard();
        }

        function hasLiberty(r, c, color, visited, group) {
            const key = `${r},${c}`;
            if (visited.has(key)) return false;
            visited.add(key);
            group.push([r, c]);

            const directions = [[0,1],[0,-1],[1,0],[-1,0]];
            let liberty = false;

            for (let [dr, dc] of directions) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                    if (board[nr][nc] === 0) return true; // 활로 있음
                    if (board[nr][nc] === color) {
                        if (hasLiberty(nr, nc, color, visited, group)) liberty = true;
                    }
                }
            }
            return liberty;
        }

        // 오목 승리 로직
        function checkWin(r, c) {
            const color = board[r][c];
            const directions = [[0,1],[1,0],[1,1],[1,-1]];
            
            for (let [dr, dc] of directions) {
                let count = 1;
                // 한 방향
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < size && nc >= 0 && nc < size && board[nr][nc] === color) {
                    count++; nr += dr; nc += dc;
                }
                // 반대 방향
                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < size && nc >= 0 && nc < size && board[nr][nc] === color) {
                    count++; nr -= dr; nc -= dc;
                }
                if (count === 5) return true; // 장목 금지는 추가 구현 필요
            }
            return false;
        }

        function isBoardFull() {
            return board.every(row => row.every(cell => cell !== 0));
        }
    </script>
</body>
</html>
