<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>풍류 대국: 오둑</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');
        
        :root { --bg-color: #f4e9d5; --ink-black: #1a1a1a; --btn-color: #2c2c2c; }
        
        body { 
            background-color: var(--bg-color); 
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            font-family: 'Noto Serif KR', serif; 
            margin: 0; overflow: hidden; touch-action: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: var(--ink-black);
        }

        /* UI 스크린 */
        .screen {
            display: none; width: 90%; max-width: 400px;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(5px);
            padding: 20px; border: 3px double var(--ink-black); border-radius: 8px;
            text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10;
        }
        .screen.active { display: block; }

        h1 { font-size: 2.5rem; margin-bottom: 10px; border-bottom: 2px solid var(--ink-black); display: inline-block; padding-bottom: 5px; }
        button {
            background: var(--btn-color); color: #f4e9d5; border: none;
            padding: 12px; width: 100%; margin: 5px 0; font-size: 1.1rem;
            font-family: 'Noto Serif KR', serif; font-weight: bold; border-radius: 5px;
            cursor: pointer; transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        button.secondary { background: #5d4037; }

        /* 게임 캔버스 */
        #game-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
        canvas { display: block; touch-action: none; }
        
        /* 인게임 UI */
        #ingame-ui {
            position: fixed; top: 10px; left: 0; width: 100%; pointer-events: none;
            display: flex; justify-content: space-between; padding: 0 10px; box-sizing: border-box;
            z-index: 5;
        }
        .ui-tag { background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 15px; font-size: 0.9rem; }
        
        #btn-reset-view {
            position: fixed; top: 60px; right: 10px; pointer-events: auto;
            width: 40px; height: 40px; border-radius: 50%; background: var(--ink-black); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 5;
        }
        
        #btn-surrender {
            position: fixed; bottom: 20px; right: 20px; width: auto; padding: 10px 20px;
            background: #d32f2f; color: white; border-radius: 5px; border:none;
            z-index: 5; pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-family: 'Noto Serif KR', serif; font-weight: bold;
        }

        /* 채팅 */
        #chat-toggle {
            position: fixed; bottom: 20px; left: 20px; z-index: 20;
            width: 50px; height: 50px; border-radius: 50%; background: #0277bd; color: white;
            border: none; font-size: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto;
        }
        #chat-box {
            position: fixed; bottom: 80px; left: 10px; width: 250px;
            background: rgba(0,0,0,0.8); border-radius: 10px; padding: 10px;
            z-index: 19; transform: translateX(-300px); transition: transform 0.3s;
            pointer-events: auto; display: flex; flex-direction: column;
        }
        #chat-box.open { transform: translateX(0); }
        #chat-msgs { height: 150px; overflow-y: auto; color: white; font-size: 0.8rem; margin-bottom: 5px; text-align: left; }
        #chat-input { width: 100%; padding: 5px; box-sizing: border-box; }
        .msg-me { color: #81d4fa; } .msg-opp { color: #ffab91; }

        /* 기타 */
        #confetti-canvas { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 100; }
        #toast {
            visibility: hidden; min-width: 250px; background-color: rgba(0,0,0,0.8); color: #fff;
            text-align: center; border-radius: 25px; padding: 16px; position: fixed; z-index: 999;
            left: 50%; bottom: 10%; transform: translateX(-50%); font-size: 1rem;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 10%; opacity: 1;} }
        @keyframes fadeout { from {bottom: 10%; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <h1>오 둑 (五 局)</h1>
        <p>포위된 돌은 죽은 돌이 된다.</p>
        <button onclick="navTo('mode')">대국 시작</button>
        <button class="secondary" onclick="navTo('rules')">규칙 설명</button>
    </div>

    <div id="screen-rules" class="screen">
        <h2>규칙 설명</h2>
        <ul style="text-align:left; line-height:1.6;">
            <li><strong>승리:</strong> 오목(5개)을 먼저 완성.</li>
            <li><strong>오둑(포위):</strong> 상대 돌이 내 돌을 완전히 감싸면, 갇힌 돌은 <strong>돌무덤(회색)</strong>이 되어 무효화됩니다.</li>
            <li><strong>흑 금수:</strong> 3-3, 장목(6목 이상) 금지.</li>
        </ul>
        <button onclick="navTo('menu')">돌아가기</button>
    </div>

    <div id="screen-mode" class="screen">
        <h2>대국 방식 선택</h2>
        <button onclick="startRandomMatch()">온라인 대국</button>
        <button onclick="startGameAI()">AI 대국</button>
        <button onclick="startGameLocal()">2인용 대국</button>
        <button class="secondary" onclick="navTo('menu')">뒤로가기</button>
    </div>

    <div id="screen-match" class="screen">
        <h2>매칭 중...</h2>
        <p id="match-timer">00초 경과</p>
        <p>30초 후 AI와 연결됩니다.</p>
        <button class="secondary" onclick="cancelMatch()">취소</button>
    </div>

    <div id="game-container">
        <canvas id="board-canvas"></canvas>
        <div id="ingame-ui">
            <div class="ui-tag" id="status-display">흑의 차례</div>
            <div class="ui-tag" id="mode-display"></div>
        </div>
        <div id="btn-reset-view" onclick="resetViewport()">⟲</div>
        <button id="btn-surrender" onclick="surrender()">기권</button>
        
        <button id="chat-toggle" onclick="toggleChat()" style="display:none;">💬</button>
        <div id="chat-box">
            <div id="chat-msgs"></div>
            <input type="text" id="chat-input" placeholder="메시지 전송 (Enter)" onkeydown="if(event.keyCode===13) sendChat()">
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <div id="toast"></div>

    <script>
        /* =========================================
           1. Firebase 설정
           ========================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyD0GwpH4EH4LIwu4kzyxfEL2zCJPXTrUgk", 
            databaseURL: "https://dook-mobile-default-rtdb.asia-southeast1.firebasedatabase.app",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let gameState = 'MENU';
        let gameMode = ''; 
        let myId = 'U_' + Math.random().toString(36).substr(2, 6);
        let roomRef = null;
        let matchTimerInterval = null;

        // 게임 변수
        let board = [], rows = 19, cols = 19;
        let turn = 1, myColor = 1;
        let isMyTurn = false, isOnlineAI = false;

        // 캔버스
        const canvas = document.getElementById('board-canvas');
        const ctx = canvas.getContext('2d');
        let cellSize = 40, offsetX = 0, offsetY = 0, scale = 1;
        let isDragging = false, lastTouchX = 0, lastTouchY = 0, lastDist = 0;

        /* =========================================
           2. 네비게이션
           ========================================= */
        function navTo(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            
            if (screenId === 'menu') {
                document.getElementById('game-container').style.display = 'none';
                resetGameData();
            }
        }

        function resetGameData() {
            if (roomRef) roomRef.off();
            roomRef = null;
            board = [];
            turn = 1;
            gameState = 'MENU';
            document.getElementById('chat-toggle').style.display = 'none';
            document.getElementById('chat-box').classList.remove('open');
            document.getElementById('chat-msgs').innerHTML = '';
            document.getElementById('confetti-canvas').getContext('2d').clearRect(0,0,9999,9999);
        }

        function showToast(msg) {
            const x = document.getElementById("toast");
            x.className = "show"; x.innerText = msg;
            setTimeout(() => { x.className = x.className.replace("show", ""); }, 3000);
        }

        /* =========================================
           3. 매칭 시스템 (중요: 잘 된다고 하신 코드 방식 사용)
           ========================================= */
        function startRandomMatch() {
            navTo('match');
            let startTime = Date.now();
            let timerEl = document.getElementById('match-timer');
            
            matchTimerInterval = setInterval(() => {
                let elapsed = Math.floor((Date.now() - startTime) / 1000);
                timerEl.innerText = elapsed + "초 경과";
                if(elapsed >= 30) {
                    clearInterval(matchTimerInterval);
                    startFakeOnlineAI(); // 30초 초과 시 AI
                }
            }, 1000);

            // 잘 작동했던 방식: 트랜잭션으로 내가 방장이 될 수 있는지 확인
            const matchRef = db.ref('matchmaking/queue');
            matchRef.transaction((current) => {
                if (current === null) return { roomId: 'room_' + myId, p1: myId };
                else return null; // 이미 누군가 있으면 취소(null 반환)
            }, (error, committed, snapshot) => {
                if (committed && snapshot.val()) {
                    // 내가 방장(P1)
                    setupRoom(snapshot.val().roomId, true);
                } else {
                    // 내가 참가자(P2) - last_room 확인
                    db.ref('matchmaking/last_room').once('value').then(s => {
                        if(s.val()) setupRoom(s.val(), false);
                        else startFakeOnlineAI(); // 예외: 방이 없으면 AI
                    });
                }
            });
        }

        function setupRoom(rid, isP1) {
            roomRef = db.ref('rooms/' + rid);
            
            if (isP1) {
                // P1: 방 만들기
                // 색상 랜덤 배정 (P1이 흑일지 백일지)
                let p1c = Math.random() < 0.5 ? 1 : 2;
                roomRef.set({ 
                    board: JSON.stringify(createEmptyBoard(19, 19)), 
                    turn: 1, 
                    players: 1, 
                    p1: myId,
                    p1Color: p1c 
                });
                db.ref('matchmaking/last_room').set(rid);
                
                // 상대방 입장 대기
                roomRef.on('value', snap => {
                    if (snap.val() && snap.val().players === 2) {
                        clearInterval(matchTimerInterval);
                        roomRef.off('value'); // 1회성 대기 해제 후 게임 리스너로 전환
                        myColor = p1c;
                        startGameOnline(19, 19, rid);
                    }
                });
            } else {
                // P2: 방 입장
                roomRef.transaction(room => {
                    if (!room || room.players === 2) return; // 이미 찼으면 취소
                    room.players = 2; 
                    room.p2 = myId;
                    return room;
                }, (err, comm, snap) => {
                    if (comm) {
                        clearInterval(matchTimerInterval);
                        let p1c = snap.val().p1Color;
                        myColor = (p1c === 1 ? 2 : 1); // P1과 반대 색
                        startGameOnline(19, 19, rid);
                    } else {
                        startFakeOnlineAI();
                    }
                });
            }
        }

        function cancelMatch() {
            clearInterval(matchTimerInterval);
            if (roomRef) roomRef.remove();
            db.ref('matchmaking/queue').remove(); // 큐도 비워줌
            navTo('mode');
        }

        function startFakeOnlineAI() {
            clearInterval(matchTimerInterval);
            if(roomRef) roomRef.off();
            isOnlineAI = true;
            startGameAI(); // AI 모드로 바로 연결
        }

        /* =========================================
           4. 게임 시작 및 로직
           ========================================= */
        function startGameOnline(w, h, rid) {
            gameMode = 'ONLINE'; isOnlineAI = false;
            initGameCommon(w, h);
            document.getElementById('chat-toggle').style.display = 'block';

            // 실시간 보드 동기화
            roomRef = db.ref('rooms/' + rid);
            roomRef.on('value', snap => {
                const d = snap.val();
                if (!d) return; 
                if (d.winner) { endGame(d.winner); return; }

                let sBoard = JSON.parse(d.board);
                if (JSON.stringify(sBoard) !== JSON.stringify(board)) {
                    board = sBoard;
                    turn = d.turn;
                    drawBoard();
                    checkTurn();
                }
            });
            // 채팅 수신
            roomRef.child('chat').on('child_added', snap => appendChat(snap.val().sender === myId, snap.val().text));
        }

        function startGameAI() {
            gameMode = 'AI';
            // AI 대국 시 내 돌 색상 랜덤 결정
            myColor = Math.random() < 0.5 ? 1 : 2;
            initGameCommon(19, 19);
            
            // 만약 내가 백(2)이면 AI(흑)가 먼저 둠
            if(myColor === 2) setTimeout(aiMoveSmart, 1000);
        }

        function startGameLocal() {
            gameMode = 'LOCAL'; myColor = 1;
            initGameCommon(19, 19);
        }

        function initGameCommon(w, h) {
            rows = w; cols = h;
            board = createEmptyBoard(rows, cols);
            turn = 1; gameState = 'PLAYING';
            
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('game-container').style.display = 'block';
            
            let txt = gameMode === 'ONLINE' ? "온라인 대국" : (gameMode === 'LOCAL' ? "2인용" : "AI 대국");
            if(isOnlineAI) txt = "온라인 (AI)";
            document.getElementById('mode-display').innerText = txt;
            
            initViewport(); drawBoard(); checkTurn();
        }

        function createEmptyBoard(r, c) { return Array.from({length:r}, ()=>Array(c).fill(0)); }

        function checkTurn() {
            let cName = turn === 1 ? "흑" : "백";
            let isMe = false;
            if (gameMode === 'LOCAL') isMe = true;
            else isMe = (turn === myColor);
            
            isMyTurn = isMe;
            let sub = "";
            if (gameMode !== 'LOCAL') sub = isMe ? " (당신)" : " (상대)";
            document.getElementById('status-display').innerText = `${cName}의 차례${sub}`;

            // AI 턴
            if (gameMode === 'AI' && !isMe && gameState === 'PLAYING') {
                setTimeout(aiMoveSmart, 700);
            }
        }

        /* =========================================
           5. 캔버스 렌더링 & 입력
           ========================================= */
        function initViewport() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            cellSize = Math.min(canvas.width, canvas.height) / 12;
            resetViewport();
        }
        function resetViewport() {
            scale = 1; 
            offsetX = (canvas.width - rows * cellSize) / 2;
            offsetY = (canvas.height - cols * cellSize) / 2;
            drawBoard();
        }
        function drawBoard() {
            if (gameState === 'MENU') return;
            ctx.fillStyle = '#d2b48c'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.save(); ctx.translate(offsetX, offsetY); ctx.scale(scale, scale);

            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            for(let i=0; i<rows; i++) { ctx.moveTo(0, i*cellSize+cellSize/2); ctx.lineTo(cols*cellSize, i*cellSize+cellSize/2); }
            for(let i=0; i<cols; i++) { ctx.moveTo(i*cellSize+cellSize/2, 0); ctx.lineTo(i*cellSize+cellSize/2, rows*cellSize); }
            ctx.stroke();
            ctx.strokeRect(cellSize/2, cellSize/2, (cols-1)*cellSize, (rows-1)*cellSize);

            // 화점
            if(rows===19) [3,9,15].forEach(r=>[3,9,15].forEach(c=>{
                ctx.beginPath(); ctx.arc(c*cellSize+cellSize/2, r*cellSize+cellSize/2, 3, 0, Math.PI*2); ctx.fillStyle='#000'; ctx.fill();
            }));

            // 돌
            for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) if(board[r][c]!==0) drawStone(r,c,board[r][c]);
            ctx.restore();
        }
        function drawStone(r, c, type) {
            let cx = c*cellSize+cellSize/2, cy = r*cellSize+cellSize/2, rs = cellSize*0.42;
            ctx.beginPath(); ctx.arc(cx, cy, rs, 0, Math.PI*2);
            if(type===1){
                let g=ctx.createRadialGradient(cx-rs*0.3, cy-rs*0.3, rs*0.1, cx, cy, rs);
                g.addColorStop(0,'#555'); g.addColorStop(1,'#000'); ctx.fillStyle=g;
            } else if(type===2){
                let g=ctx.createRadialGradient(cx-rs*0.3, cy-rs*0.3, rs*0.1, cx, cy, rs);
                g.addColorStop(0,'#fff'); g.addColorStop(1,'#ccc'); ctx.fillStyle=g;
            } else { ctx.fillStyle='#7f8c8d'; }
            ctx.fill();
        }

        // 터치/클릭
        canvas.addEventListener('touchstart', e => {
            if(e.touches.length===2) lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
            else { isDragging=true; lastTouchX=e.touches[0].clientX; lastTouchY=e.touches[0].clientY; }
        }, {passive:false});
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if(e.touches.length===2) {
                let d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                scale = Math.max(0.5, Math.min(3, scale * (1 + (d-lastDist)*0.005))); lastDist=d; drawBoard();
            } else if(isDragging) {
                offsetX += (e.touches[0].clientX-lastTouchX); offsetY += (e.touches[0].clientY-lastTouchY);
                lastTouchX=e.touches[0].clientX; lastTouchY=e.touches[0].clientY; drawBoard();
            }
        }, {passive:false});
        canvas.addEventListener('touchend', () => isDragging=false);
        canvas.addEventListener('click', e => {
            if(gameState!=='PLAYING' || !isMyTurn || isDragging) return;
            let r = Math.floor((e.clientY-offsetY)/scale/cellSize);
            let c = Math.floor((e.clientX-offsetX)/scale/cellSize);
            attemptMove(r, c);
        });

        /* =========================================
           6. 착수 및 오둑 규칙
           ========================================= */
        function attemptMove(r, c) {
            if (r<0||r>=rows||c<0||c>=cols||board[r][c]!==0) return;
            
            // 흑 3-3 금수 체크
            if(turn === 1 && checkDoubleThree(r, c)) {
                showToast("⛔ 흑 3-3 금수!"); return;
            }

            makeMove(r, c, turn);
        }

        function makeMove(r, c, color) {
            board[r][c] = color;
            // 포위 체크
            let opp = (color===1?2:1);
            [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc])=>{
                let nr=r+dr, nc=c+dc;
                if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===opp) {
                    let g=[]; if(!hasLiberty(nr,nc,opp,new Set(),g)) g.forEach(([gr,gc])=>board[gr][gc]=-1);
                }
            });

            if(checkWin(r,c,color)) { drawBoard(); endGame(color); return; }
            
            let next = (color===1?2:1);
            if(gameMode==='ONLINE' && !isOnlineAI) roomRef.update({ board: JSON.stringify(board), turn: next });
            else { turn = next; drawBoard(); checkTurn(); }
        }

        function checkDoubleThree(r, c) {
            board[r][c] = 1; 
            let cnt = 0;
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for(let [dr,dc] of dirs) if(isOpenThree(r,c,dr,dc)) cnt++;
            board[r][c] = 0;
            return cnt >= 2;
        }
        function isOpenThree(r, c, dr, dc) {
            let s = "";
            for(let i=-4; i<=4; i++) {
                let nr=r+dr*i, nc=c+dc*i;
                if(nr<0||nr>=rows||nc<0||nc>=cols) s+="2";
                else if(board[nr][nc]===0) s+="0";
                else if(board[nr][nc]===1) s+="1";
                else s+="2";
            }
            // 01110 패턴
            if(s.includes("01110")) return true;
            // 010110 패턴
            if(s.includes("010110") || s.includes("011010")) return true;
            return false;
        }

        /* =========================================
           7. AI (Heuristic)
           ========================================= */
        function aiMoveSmart() {
            let aiC = turn; // 현재 AI가 둘 차례
            let opC = (turn===1?2:1);
            let bestScore = -Infinity, bestMoves = [];

            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    if(board[r][c] !== 0) continue;
                    // 최적화: 주변에 돌이 없으면 스킵 (중앙 제외)
                    if(!hasNeighbor(r,c) && board.flat().some(x=>x>0)) continue;

                    let atk = evaluate(r, c, aiC);
                    let def = evaluate(r, c, opC);
                    let score = atk + (def * 1.2); // 방어 우선

                    // 흑이면 금수 회피
                    if(aiC===1 && checkDoubleThree(r,c)) score = -99999;

                    score += Math.random() * 5; // 랜덤성

                    if(score > bestScore) { bestScore = score; bestMoves = [{r,c}]; }
                    else if(score === bestScore) bestMoves.push({r,c});
                }
            }
            if(bestMoves.length>0) {
                let m = bestMoves[Math.floor(Math.random()*bestMoves.length)];
                makeMove(m.r, m.c, aiC);
            } else {
                makeMove(9,9,aiC); // 첫수
            }
        }
        function hasNeighbor(r,c) {
            for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++) {
                let nr=r+i, nc=c+j;
                if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]>0) return true;
            }
            return false;
        }
        function evaluate(r, c, col) {
            board[r][c] = col;
            let score = 0;
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for(let [dr,dc] of dirs) {
                let s = getLineStr(r,c,dr,dc,col);
                if(s.includes("11111")) score+=50000;
                else if(s.includes("011110")) score+=10000;
                else if(s.includes("01111")||s.includes("11110")) score+=2000;
                else if(s.includes("01110")) score+=1000;
                else if(s.includes("0110")) score+=100;
            }
            board[r][c] = 0;
            return score;
        }
        function getLineStr(r,c,dr,dc,col) {
            let s="";
            for(let i=-4;i<=4;i++){
                let nr=r+dr*i, nc=c+dc*i;
                if(nr<0||nr>=rows||nc<0||nc>=cols) s+="2";
                else if(board[nr][nc]===0) s+="0";
                else if(board[nr][nc]===col) s+="1";
                else s+="2";
            }
            return s;
        }

        /* =========================================
           8. 승리 및 종료
           ========================================= */
        function checkWin(r, c, col) {
            let win=false;
            [[0,1],[1,0],[1,1],[1,-1]].forEach(([dr,dc])=>{
                let cnt=1, nr=r+dr, nc=c+dc;
                while(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===col){cnt++;nr+=dr;nc+=dc;}
                nr=r-dr; nc=c-dc;
                while(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===col){cnt++;nr-=dr;nc-=dc;}
                if(cnt===5) win=true;
            });
            return win;
        }
        function hasLiberty(r,c,col,vis,grp) {
            let key=`${r},${c}`; if(vis.has(key)) return false;
            vis.add(key); grp.push([r,c]);
            let alive=false;
            [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc])=>{
                let nr=r+dr, nc=c+dc;
                if(nr>=0&&nr<rows&&nc>=0&&nc<cols){
                    if(board[nr][nc]===0||board[nr][nc]===-1) alive=true;
                    else if(board[nr][nc]===col) { if(hasLiberty(nr,nc,col,vis,grp)) alive=true; }
                }
            });
            return alive;
        }

        function surrender() {
            if(!confirm("기권하시겠습니까?")) return;
            endGame(turn===1?2:1);
        }

        function endGame(winner) {
            gameState = 'END';
            let msg = winner===1 ? "⚫ 흑돌 승리!" : "⚪ 백돌 승리!";
            showToast(msg);
            fireworks();
            setTimeout(() => {
                if(roomRef) roomRef.remove();
                navTo('menu');
            }, 4000); // 4초 후 자동 리셋
        }

        function fireworks() {
            const c=document.getElementById('confetti-canvas'), x=c.getContext('2d');
            c.width=window.innerWidth; c.height=window.innerHeight;
            let p=Array.from({length:150},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-0.5)*15,vy:(Math.random()-0.5)*15,c:`hsl(${Math.random()*360},100%,50%)`,life:150}));
            function a(){
                if(gameState!=='END') return;
                x.clearRect(0,0,c.width,c.height);
                p.forEach(k=>{
                    if(k.life>0){k.x+=k.vx;k.y+=k.vy;k.vy+=0.2;k.life--;x.fillStyle=k.c;x.beginPath();x.arc(k.x,k.y,4,0,Math.PI*2);x.fill();}
                });
                if(p.some(k=>k.life>0)) requestAnimationFrame(a);
            }
            a();
        }

        // 채팅
        function toggleChat(){document.getElementById('chat-box').classList.toggle('open');}
        function sendChat(){let i=document.getElementById('chat-input');if(i.value.trim()&&roomRef){roomRef.child('chat').push({sender:myId,text:i.value});i.value='';}}
        function appendChat(me,txt){let b=document.getElementById('chat-msgs'),d=document.createElement('div');d.className=me?'msg-me':'msg-opp';d.innerText=(me?"나: ":"상대: ")+txt;b.appendChild(d);b.scrollTop=b.scrollHeight;}

        window.addEventListener('resize', initViewport);
    </script>
